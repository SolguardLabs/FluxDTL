name: CI

on:
    push:
        branches:
            - main
            - production
    pull_request:

concurrency:
    group: flux-ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    validate:
        name: ${{ matrix.os }} / Rust stable / Node 24
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Instalar toolchain Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy,rustfmt

            - name: Instalar Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - name: Instalar dependencias
              run: npm ci

            - name: Ejecutar CI
              run: npm run ci

            - name: Confirmar arbol reproducible
              shell: bash
              run: git diff --exit-code -- .
